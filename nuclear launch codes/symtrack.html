<html>
  <head>
    <title>Find disease from symptoms</title>
    <style>
      input {
        height: 40px;
        width: 800px;
        margin-top: 500px;
        margin-right: 50px;
        font-family: Verdana;
      }
      button{
        height: 40px;
        width: 40px;
        margin-top: 500px;
        margin-left: 610px;
      }
      .displayinput {
        text-align: right;
        margin: 70px;
        background-color: blue;
        border: 0px solid blue;
        color: white;
      }
    </style>
  </head>
  <body>
    <p id="text" class="displayinput"></p>
    <input type="text" id="UserInput" placeholder="Start Chatting Here">
    <button id="enter">Send</button>
  </body>
  <script>
    document.getElementById(`enter`).onclick = function() {
     input =  document.getElementById(`UserInput`).value
      document.getElementById(`text`).textContent = `${input}`
    }
  </script>
</html>
