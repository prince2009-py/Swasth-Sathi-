<html>
  <head>
    <title>Find disease from symptoms</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
      #chat-box { border: 1px solid #ccc; width: 800px; padding: 10px; min-height: 200px; margin-bottom: 10px; }
      .user-msg { color: #333; margin: 8px 0; text-align: right; background-color: #9EFFC8; }
      .ai-msg { color: #0a6; margin: 8px 0; text-align: left; background-color: #C0FF9E; }
      button { padding: 8px 16px; }
      #status-indicator { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 14px; }
#status-dot { width: 10px; height: 10px; border-radius: 50%; background: gray; }
#status-dot.online { background: #0a6; }
#status-dot.offline { background: #c33; }
#status-dot.waking { background: #e6a700; }
      input {
        align: left;
        text-align: left;
        height: 40px;
        width: 700px;
        border-radius: 20px;
        border-margin: 0px;
        border: 0px;
      }
      
    </style>
  </head>
  <body>
    <div id="chat-box"></div>
    <nav id=cands><input type="text" id="UserInput" placeholder="Enter Your Message Here...">
    <button id="Send">Send</button></nav>
    <script src="index.js"></script>
  </body>
</html>
