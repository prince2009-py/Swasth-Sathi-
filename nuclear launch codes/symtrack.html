<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Find disease from symptoms — SehatMitra</title>
    <style>
      :root{
        --bg: #f6f8fb;
        --card: #ffffff;
        --muted: #6b7280;
        --accent: #047857; /* green */
        --accent-700: #065f46;
        --danger: #dc2626;
        --glass: rgba(255,255,255,0.6);
        --radius: 12px;
        --max-width: 720px;
        --shadow: 0 6px 18px rgba(20,20,30,0.06);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      html,body{height:100%;}
      body{
        margin:0;
        background:linear-gradient(180deg,#eef2f7 0%,var(--bg) 100%);
        display:flex;
        align-items:center;
        justify-content:center;
        padding:24px;
        color:#0f172a;
      }

      .app{
        width:100%;
        max-width:var(--max-width);
        background:var(--card);
        border-radius:calc(var(--radius) + 4px);
        box-shadow:var(--shadow);
        overflow:hidden;
        display:flex;
        flex-direction:column;
      }

      header{
        padding:18px 20px;
        display:flex;
        align-items:center;
        gap:14px;
        border-bottom:1px solid #eef2f5;
      }

      header h1{
        margin:0;
        font-size:18px;
        line-height:1;
      }

      header p{margin:0;color:var(--muted);font-size:13px}

      main{
        padding:1px 2px;
        display:flex;
        flex-direction:column;
        gap:2px;
        height: 90%;
        width: 100%;
      }

      #chat-box{
        border-radius:10px;
        border:1px solid #e6eef3;
        min-height:90%;
        max-height:90%;
        overflow:auto;
        padding:12px;
        background:linear-gradient(180deg, rgba(4,120,87,0.02), rgba(255,255,255,0.4));
        display:flex;
        flex-direction:column;
        gap:8px;
        max-width: 100%;
      }

      .msg{
        max-width:78%;
        padding:10px 12px;
        border-radius:12px;
        font-size:14px;
        line-height:1.35;
        box-shadow:0 4px 12px rgba(16,24,40,0.03);
      }

      .user-msg{
        align-self:flex-end;
        background:linear-gradient(180deg,#f3f4f6,#ffffff);
        color:#0f172a;
        border-bottom-right-radius:4px;
      }

      .ai-msg{
        align-self:flex-start;
        background:linear-gradient(180deg,#ecfdf5,#d1fae5);
        color:var(--accent-700);
        border-bottom-left-radius:4px;
      }

      .meta{font-size:12px;color:var(--muted);margin-top:6px}

      form{
        display:flex;
        gap:8px;
        align-items:center;
      }

      .input-wrap{
        flex:1;display:flex;gap:8px;align-items:center;background:var(--card);padding:8px;border-radius:10px;border:1px solid #e6eef3;
      }

      input[type="text"]{
        border:0;background:transparent;outline:none;font-size:15px;padding:8px 6px;width:100%;
      }

      button#Send{
        background:var(--accent);
        color:white;padding:10px 14px;border-radius:10px;border:0;cursor:pointer;font-weight:600;
        transition:background .15s ease, transform .05s ease;box-shadow:0 6px 14px rgba(4,120,87,0.14);
      }
      button#Send:active{transform:translateY(1px)}
      button#Send[disabled]{opacity:.6;cursor:wait;}

      #status-indicator{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
      #status-dot{width:11px;height:11px;border-radius:50%;background:#9ca3af}
      #status-dot.online{background:var(--accent)}
      #status-dot.offline{background:var(--danger)}
      #status-dot.waking{background:#f59e0b}

      /* responsive */
      @media (max-width:520px){
        :root{--max-width:96vw}
        header h1{font-size:16px}
        #chat-box{min-height:220px}
      }

      /* focus styles for accessibility */
      input:focus, button:focus{box-shadow:0 0 0 3px rgba(4,120,87,0.12);border-radius:10px}

    </style>
  </head>
  <body>
    <div class="app" role="application" aria-labelledby="app-title">
      <main>
        <div id="status-indicator" aria-live="polite">
          <span id="status-dot" class="waking" aria-hidden="true"></span>
          <span id="status-text">Checking service status...</span>
        </div>

        <div id="chat-box" aria-live="polite" aria-relevant="additions" role="log">
          <!-- messages will be inserted here by index.js -->
        </div>

        <form id="chat-form" onsubmit="return false;" aria-label="Send message">
          <div class="input-wrap">
            <label for="UserInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Your message</label>
            <input id="UserInput" type="text" placeholder="Describe your symptoms (e.g. cough, fever, headache)">
            <button id="Send" type="button">Send</button>
          </div>
        </form>

        <div class="meta">Tips: mention duration and severity (mild/moderate/severe) for better suggestions.</div>
      </main>
    </div>

    <script src="index.js"></script>
    <script>
      // small enhancement: expose simple API to update status dot from index.js
      window.SehatMitra = window.SehatMitra || {};
      window.SehatMitra.setStatus = function(state){
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if(!dot || !text) return;
        dot.classList.remove('online','offline','waking');
        if(state === 'online') { dot.classList.add('online'); text.textContent = 'Online'; }
        else if(state === 'offline') { dot.classList.add('offline'); text.textContent = 'Offline'; }
        else if(state === 'waking') { dot.classList.add('waking'); text.textContent = 'Waking up...'; }
        else { text.textContent = state || 'Checking...'; }
      }

      // quick keyboard UX: Enter to send
      document.getElementById('UserInput').addEventListener('keydown', function(e){
        if(e.key === 'Enter') document.getElementById('Send').click();
      });
    </script>
  </body>
</html>
