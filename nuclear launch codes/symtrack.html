<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Find disease from symptoms — SehatMitra</title>
    <style>
      :root{
        --bg: #f4f6f9;
        --card: #ffffff;
        --muted: #64748b;
        --text: #0f172a;
        --accent: #0d9488;      
        --accent-dark: #0f766e;
        --accent-light: #e6fbf8;
        --danger: #dc2626;
        --border: #e2e8f0;
        --radius: 14px;
        --shadow: 0 8px 24px rgba(15,23,42,0.06);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      [data-theme="dark"]{
        --bg: #0b1220;
        --card: #131c2e;
        --muted: #8b98ac;
        --text: #e8edf5;
        --accent: #2dd4bf;
        --accent-dark: #14b8a6;
        --accent-light: #163331;
        --danger: #f87171;
        --border: #24304a;
        --shadow: 0 8px 24px rgba(0,0,0,0.35);
      }

      *{box-sizing:border-box;}
      html,body{height:100%;margin:0;}
      body{
        background:var(--bg);
        color:var(--text);
        display:flex;
        flex-direction:column;
        overflow:hidden;
        transition:background .2s ease, color .2s ease;
      }

      header{
        flex:0 0 auto;
        display:flex;
        align-items:center;
        gap:12px;
        padding:14px 18px;
        background:var(--card);
        border-bottom:1px solid var(--border);
        box-shadow:var(--shadow);
        z-index:5;
        transition:background .2s ease, border-color .2s ease;
      }

      #back-btn{
        display:flex;
        align-items:center;
        justify-content:center;
        width:38px;
        height:38px;
        border-radius:12px;
        border:1px solid var(--border);
        background:var(--card);
        color:var(--text);
        text-decoration:none;
        flex-shrink:0;
        transition:background .15s ease, border-color .15s ease, transform .05s ease;
      }
      #back-btn:hover{background:var(--accent-light);border-color:var(--accent);}
      #back-btn:active{transform:translateY(1px);}
      #back-btn svg{width:18px;height:18px;stroke:var(--text);}

      .header-titles{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
      .header-titles h1{margin:0;font-size:16px;font-weight:700;}
      .header-titles p{margin:2px 0 0;color:var(--muted);font-size:12.5px;}

      #status-indicator{
        margin-left:auto;
        display:flex;align-items:center;gap:7px;
        font-size:12.5px;color:var(--muted);
        flex-shrink:0;
        white-space:nowrap;
      }
      #status-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;transition:background .2s ease;}
      #status-dot.online{background:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
      #status-dot.offline{background:var(--danger);box-shadow:0 0 0 3px #fee2e2;}
      #status-dot.waking{background:#f59e0b;box-shadow:0 0 0 3px #fef3c7;}

      #theme-toggle{
        display:flex;
        align-items:center;
        justify-content:center;
        width:38px;
        height:38px;
        border-radius:12px;
        border:1px solid var(--border);
        background:var(--card);
        color:var(--text);
        cursor:pointer;
        flex-shrink:0;
        transition:background .15s ease, border-color .15s ease, transform .05s ease;
      }
      #theme-toggle:hover{background:var(--accent-light);border-color:var(--accent);}
      #theme-toggle:active{transform:translateY(1px);}
      #theme-toggle svg{width:18px;height:18px;stroke:var(--text);}
      #theme-toggle .sun{display:none;}
      [data-theme="dark"] #theme-toggle .moon{display:none;}
      [data-theme="dark"] #theme-toggle .sun{display:block;}

      /* ---------- Main / chat ---------- */
      main{
        flex:1 1 auto;
        display:flex;
        flex-direction:column;
        min-height:0;
        width:97%;
        margin:3px auto;
        padding:16px;
        gap:10px;
      }

      #chat-box{
        flex:1 1 auto;
        min-height:0;
        overflow-y:auto;
        border-radius:20px;
        border:1px solid var(--border);
        padding:16px;
        background:var(--card);
        display:flex;
        flex-direction:column;
        gap:10px;
        box-shadow:var(--shadow);
        transition:background .2s ease, border-color .2s ease;
      }

      .msg{
        max-width:90%;
        padding:16px 20px;
        border-radius:18px;
        font-size:14.5px;
        line-height:1.45;
        box-shadow:0 2px 8px rgba(16,24,40,0.04);
        word-wrap:break-word;
      }

      .user-msg{
        align-self:flex-end;
        max-width:90%;
        background:var(--accent);
        color:#ffffff;
        border-radius:6px;
        border-margin: 3px;
      }

      .ai-msg{
        align-self:flex-start;
        max-width:78%;
        background:var(--accent-light);
        color:var(--accent-dark);
        border:1px solid #ccf0ea;
        border-radius:6px;
        border-margin: 3px;
      }
      [data-theme="dark"] .ai-msg{
        border-color:var(--border);
      }

      /* ---------- Input area ---------- */
      form{
        flex:0 0 auto;
        display:flex;
        gap:10px;
        align-items:center;
      }

      .input-wrap{
        flex:1;
        display:flex;
        gap:8px;
        align-items:center;
        background:var(--card);
        padding:6px 6px 6px 14px;
        border-radius:18px;
        border:4px solid var(--border);
        box-shadow:var(--shadow);
        transition:border-color .15s ease, box-shadow .15s ease, background .2s ease;
      }
      .input-wrap:focus-within{
        border-color:var(--accent);
        box-shadow:0 0 0 3px var(--accent-light);
      }

      input[type="text"]{
        border:0;background:transparent;outline:none;font-size:15px;padding:10px 4px;width:100%;color:var(--text);
      }
      input[type="text"]::placeholder{color:#9aa4b2;}

      button#Send{
        display:flex;
        align-items:center;
        gap:8px;
        background:var(--accent);
        color:#fff;
        padding:11px 18px;
        border-radius:14px;
        border:0;
        cursor:pointer;
        font-weight:600;
        font-size:14.5px;
        letter-spacing:.2px;
        box-shadow:0 4px 12px rgba(13,148,136,0.28);
        transition:background .15s ease, transform .05s ease, box-shadow .15s ease;
      }
      button#Send:hover{background:var(--accent-dark);box-shadow:0 6px 16px rgba(13,148,136,0.34);}
      button#Send:active{transform:translateY(1px);}
      button#Send[disabled]{opacity:.6;cursor:wait;box-shadow:none;}
      button#Send svg{width:16px;height:16px;stroke:#fff;flex-shrink:0;}

      .meta{
        flex:0 0 auto;
        color:var(--muted);
        font-size:12px;
        text-align:center;
        padding-bottom:2px;
      }

      /* scrollbar polish */
      #chat-box::-webkit-scrollbar{width:8px;}
      #chat-box::-webkit-scrollbar-thumb{background:#d6dde5;border-radius:8px;}
      #chat-box::-webkit-scrollbar-track{background:transparent;}
      [data-theme="dark"] #chat-box::-webkit-scrollbar-thumb{background:#2a3652;}

      /* focus styles for accessibility */
      input:focus, button:focus{outline:none;}

      @media (max-width:520px){
        main{padding:10px;gap:8px;}
        .msg{max-width:94%;}
        .ai-msg{max-width:88%;}
        header{padding:12px 14px;}
      }
    </style>
  </head>
  <body>
    <header>
      <a id="back-btn" href="index.html" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </a>
      <div class="header-titles">
        <h1>SehatMitra</h1>
        <p>Find possible conditions from your symptoms</p>
      </div>
      <div id="status-indicator" aria-live="polite">
        <span id="status-dot" class="waking" aria-hidden="true"></span>
        <span id="status-text">Checking service status...</span>
      </div>
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
    </header>

    <main>
      <div id="chat-box" aria-live="polite" aria-relevant="additions" role="log">
        <!-- messages will be inserted here by index.js -->
      </div>

      <form id="chat-form" onsubmit="return false;" aria-label="Send message">
        <div class="input-wrap">
          <label for="UserInput" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0">Your message</label>
          <input id="UserInput" type="text" placeholder="Describe your symptoms (e.g. cough, fever, headache)">
          <button id="Send" type="button">
            <span>Send</span>
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 2L11 13"></path>
              <path d="M22 2l-7 20-4-9-9-4 20-7z"></path>
            </svg>
          </button>
        </div>
      </form>

      <div class="meta">Tips: mention duration and severity (mild/moderate/severe) for better suggestions.</div>
    </main>

    <script src="index.js"></script>
    <script>
      // small enhancement: expose simple API to update status dot from index.js
      window.SehatMitra = window.SehatMitra || {};
      window.SehatMitra.setStatus = function(state){
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        if(!dot || !text) return;
        dot.classList.remove('online','offline','waking');
        if(state === 'online') { dot.classList.add('online'); text.textContent = 'Online'; }
        else if(state === 'offline') { dot.classList.add('offline'); text.textContent = 'Offline'; }
        else if(state === 'waking') { dot.classList.add('waking'); text.textContent = 'Waking up...'; }
        else { text.textContent = state || 'Checking...'; }
      }

      // quick keyboard UX: Enter to send
      document.getElementById('UserInput').addEventListener('keydown', function(e){
        if(e.key === 'Enter') document.getElementById('Send').click();
      });

      // ---------- Dark mode toggle (persisted in localStorage, shared key across the site) ----------
      (function(){
        const root = document.documentElement;
        const toggleBtn = document.getElementById('theme-toggle');
        const STORAGE_KEY = 'sehatmitra-theme';

        function applyTheme(theme){
          if(theme === 'dark'){
            root.setAttribute('data-theme', 'dark');
          } else {
            root.removeAttribute('data-theme');
          }
        }

        // On load: use saved preference, otherwise fall back to system preference
        const saved = localStorage.getItem(STORAGE_KEY);
        if(saved){
          applyTheme(saved);
        } else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
          applyTheme('dark');
        }

        toggleBtn.addEventListener('click', function(){
          const isDark = root.getAttribute('data-theme') === 'dark';
          const next = isDark ? 'light' : 'dark';
          applyTheme(next);
          localStorage.setItem(STORAGE_KEY, next);
        });

        // Stay in sync if the theme is changed on another tab/page of the same site
        window.addEventListener('storage', function(e){
          if(e.key === STORAGE_KEY) applyTheme(e.newValue);
        });
      })();
    </script>
  </body>
</html>
